<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#080A18;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
     color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;overflow-x:hidden}
.brilho{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(90% 70% at 50% -10%,rgba(45,88,220,.38) 0%,rgba(8,10,24,0) 62%)}
.grade{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:78px 78px;
  mask-image:radial-gradient(70% 60% at 50% 30%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000 0%,transparent 78%)}
.caixa{position:relative;z-index:1;width:min(100%,680px);text-align:center;
  background:rgba(255,255,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:0 26px 70px rgba(0,0,0,.5);
  padding:clamp(34px,6vw,58px) clamp(24px,5vw,54px)}
.marca{display:block;width:min(230px,62vw);margin:0 auto 30px}
.codigo{font-size:clamp(62px,15vw,104px);font-weight:700;line-height:1;letter-spacing:-2px;
  background:linear-gradient(120deg,#6D9BF5,#1D4ED8 62%,#4C86FF);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin-top:14px;font-size:clamp(19px,3.4vw,25px);font-weight:600;letter-spacing:.2px}
p{margin-top:12px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.66)}
.acoes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.botao{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 26px;border-radius:100px;
  font-size:14.5px;font-weight:600;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.principal{background:#1D4ED8;color:#fff}
.principal:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(29,78,216,.45)}
.secundario{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.16)}
.secundario:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.atalhos{margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);
  display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center;font-size:13.5px}
.atalhos a{color:rgba(255,255,255,.62);text-decoration:none}
.atalhos a:hover{color:#fff}
@media(max-width:420px){.acoes .botao{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="brilho"></div>
<div class="grade"></div>

<main class="caixa">
  <img class="marca" src="/wp-content/uploads/2026/05/LOGO.svg" alt="Avant Cell">
  <div class="codigo">404</div>
  <h1>Esta página não existe mais</h1>
  <p>O endereço pode ter mudado ou o link que você seguiu está errado.<br>Escolha por onde continuar:</p>

  <div class="acoes">
    <a class="botao principal" href="/index.html">
      Voltar ao início
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <a class="botao secundario" href="/contato/index.html">Falar com a gente</a>
  </div>

  <nav class="atalhos">
    <a href="/recursos/index.html">Recursos</a>
    <a href="/planos/index.html">Planos</a>
    <a href="/sobre/index.html">Sobre nós</a>
    <a href="/entrar/index.html">Entrar no sistema</a>
  </nav>
</main>
</body>
</html>
